<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor K8s</title>
<meta name="application-name" content="uz.az.anchor.k8s">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<!-- installable as an app (Chrome "Install app", Safari "Add to Dock"), see README -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-title" content="Anchor K8s">
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --border: #e2e5ea;
  --text: #1b1f24; --muted: #66707c; --accent: #2f6fed; --accent-weak: #e7efff;
  --ok: #1f9d55; --ok-weak: #e3f6eb; --warn: #b7791f; --warn-weak: #fdf3dc;
  --err: #d64545; --err-weak: #fde8e8; --code-bg: #0f1419; --code-text: #d6dde4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --panel: #161a21; --panel-2: #1d222b; --border: #2a303a;
    --text: #e6e9ee; --muted: #8b95a3; --accent: #5b8ff9; --accent-weak: #1c2a47;
    --ok: #3ccf7e; --ok-weak: #15301f; --warn: #e5b04a; --warn-weak: #33290f;
    --err: #f06b6b; --err-weak: #3a1a1a; --code-bg: #0a0d11;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #161a21; --panel-2: #1d222b; --border: #2a303a;
  --text: #e6e9ee; --muted: #8b95a3; --accent: #5b8ff9; --accent-weak: #1c2a47;
  --ok: #3ccf7e; --ok-weak: #15301f; --warn: #e5b04a; --warn-weak: #33290f;
  --err: #f06b6b; --err-weak: #3a1a1a; --code-bg: #0a0d11;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, select, input { font: inherit; color: inherit; }
.app { display: flex; flex-direction: column; height: 100vh; }

/* top navigation */
.topbar { background: var(--panel); border-bottom: 1px solid var(--border); position: relative; z-index: 5; box-shadow: 0 1px 0 rgba(0,0,0,.02), 0 6px 18px -12px rgba(15,30,60,.25); }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(47,111,237,.45), rgba(20,184,166,.45), transparent); }
.tb-row { display: flex; align-items: center; gap: 12px; padding: 10px 24px; flex-wrap: wrap; }
.tb-row .sp { flex: 1; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; padding-right: 14px; margin-right: 2px; border-right: 1px solid var(--border); }
.scope { display: flex; gap: 8px; }
.sel { display: flex; align-items: center; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 0 0 0 10px; }
.sel:focus-within { border-color: var(--accent); }
.sel > span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
.sel select { border: 0; background: transparent; width: auto; max-width: 160px; padding: 6px 10px 6px 6px; font-weight: 600; }
.btn.icon { display: inline-grid; place-items: center; width: 34px; height: 34px; padding: 0; border-radius: 10px; }
.tb-row > select { border-radius: 10px; }
#lang { font-weight: 600; }
#auto { width: 92px !important; }
.conn { cursor: default; }
.conn { padding: 4px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { padding-left: 32px !important; width: 180px !important; border-radius: 10px !important; }
.sections { display: flex; gap: 4px; padding: 0 20px; overflow-x: auto; scrollbar-width: none; }
.sections::-webkit-scrollbar { display: none; }
.sec { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px 12px; background: none; border: 0; cursor: pointer; color: var(--muted); font-weight: 550; white-space: nowrap; border-radius: 10px 10px 0 0; transition: color .15s, background .15s; }
.sec svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.sec:hover { color: var(--text); background: var(--panel-2); }
.sec.active { color: var(--accent); }
.sec.active::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: linear-gradient(90deg, #2f6fed, #14b8a6); }
.sec .badge { margin-left: 2px; }
.badge.warn { background: var(--warn); }
.subbar { display: flex; gap: 8px; padding: 12px 24px 4px; overflow-x: auto; scrollbar-width: none; flex: none; }
.subbar::-webkit-scrollbar { display: none; }
.subbar[hidden] { display: none; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); cursor: pointer; white-space: nowrap; font-weight: 550; transition: all .15s; }
.chip:hover { color: var(--text); border-color: var(--accent); }
.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 12px -4px rgba(47,111,237,.6); }
.chip .count { font-size: 11.5px; font-variant-numeric: tabular-nums; padding: 0 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); line-height: 18px; }
.chip.active .count { background: rgba(255,255,255,.22); color: #fff; }
.chip .count:empty { display: none; }
.foot { display: flex; gap: 18px; flex-wrap: wrap; padding: 8px 24px; border-top: 1px solid var(--border); background: var(--panel); font-size: 12px; color: var(--muted); flex: none; }
.foot b { color: var(--text); font-weight: 600; }
.foot span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo { width: 32px; height: 32px; flex: none; display: block; }
.brand-text { min-width: 0; line-height: 1.15; }
.brand-name { font-weight: 750; font-size: 16px; letter-spacing: -.01em; }
.brand-name span, .splash-name span { color: var(--accent); font-weight: 650; }
.brand-id { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); font-weight: 400; margin-top: 2px; }
select.lang { width: auto; }

/* monitoring tabs */
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: #fff; font-size: 11px; font-weight: 700; text-align: center; line-height: 18px; }
.card.static { cursor: default; }
.card.static:hover { border-color: var(--border); }
.card small { font-size: 14px; color: var(--muted); font-weight: 500; }
.card.warn-card { border-color: var(--warn); background: var(--warn-weak); }
.card.err-card { border-color: var(--err); background: var(--err-weak); }
.card .s .meter { margin-left: auto; }
.meter { display: inline-block; vertical-align: middle; width: 70px; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin-left: 8px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.err i { background: var(--err); }
.mval { display: inline-block; min-width: 64px; font-variant-numeric: tabular-nums; }
.spark { vertical-align: middle; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.spark.up polyline { stroke: var(--warn); }
.pill.xs, .btn.xs { font-size: 10.5px; padding: 0 6px; }
.btn.xs { line-height: 18px; margin-left: 4px; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--panel); border: 0; padding: 5px 12px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.small { font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.form-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.form-row label { display: inline-flex; align-items: center; gap: 6px; }
.num-in { width: 90px !important; padding: 4px 8px !important; }
.url-in { width: 360px; max-width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; outline: none; }
.al-log-head { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 6px; }
.al-log { max-height: 240px; overflow: auto; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.vrow-diff td { background: var(--warn-weak); }
.vdiff { color: var(--err); font-weight: 700; }
.code table.hist { border-collapse: collapse; width: 100%; white-space: nowrap; }
.code table.hist th, .code table.hist td { border-bottom: 1px solid #2a3440; padding: 6px 10px; text-align: left; vertical-align: top; }
.code table.hist th { color: #8b95a3; position: static; background: none; }
.code table.hist tr.cur td { background: rgba(60,207,126,.08); }

/* splash */
.splash { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); transition: opacity .45s ease, visibility .45s; }
.splash.hide { opacity: 0; visibility: hidden; }
.splash-inner { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 24px; }
.splash-logo { position: relative; width: 96px; height: 96px; margin-bottom: 8px; }
.splash-logo svg { width: 100%; height: 100%; border-radius: 24px; box-shadow: 0 18px 40px rgba(47,111,237,.35); animation: bob 2.4s ease-in-out infinite; transform-origin: 50% 20%; }
.splash-logo .ripple { position: absolute; inset: -10px; border-radius: 32px; border: 2px solid var(--accent); opacity: 0; animation: ripple 2.4s ease-out infinite; }
.splash-name { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.splash-tag { color: var(--muted); font-size: 14px; margin-top: -4px; }
.splash-bar { width: 180px; height: 4px; border-radius: 2px; background: var(--panel-2); overflow: hidden; margin-top: 14px; }
.splash-bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #2f6fed, #14b8a6); animation: slide 1.2s ease-in-out infinite; }
.splash-status { font-size: 12px; color: var(--muted); }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
@keyframes ripple { 0% { transform: scale(.85); opacity: .55; } 100% { transform: scale(1.25); opacity: 0; } }
@keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
@media (prefers-reduced-motion: reduce) { .splash-logo svg, .splash-logo .ripple, .splash-bar i { animation: none; } }
select, input[type=search], input[type=number] { width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; outline: none; }
select:focus, input:focus { border-color: var(--accent); }

/* main */
.btn { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger:hover { border-color: var(--err); color: var(--err); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.err { background: var(--err); }
.demo-banner { background: var(--warn-weak); color: var(--warn); padding: 6px 24px; font-size: 13px; border-bottom: 1px solid var(--border); flex: none; }
.content { padding: 14px 24px 24px; overflow: auto; flex: 1; min-height: 0; }
.card { transition: border-color .15s, transform .15s, box-shadow .15s; }
.card:not(.static):hover { transform: translateY(-1px); box-shadow: 0 8px 20px -14px rgba(15,30,60,.45); }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card .k { color: var(--muted); font-size: 12px; }
.card .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.card .s { font-size: 12px; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 8px; display: flex; }
.bar i { display: block; height: 100%; }
h2 { font-size: 14px; margin: 0 0 10px; font-weight: 650; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
h2 { margin-top: 4px; }
.grid2 > div { min-width: 0; }

/* table */
.tbl-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel); position: sticky; top: 0; cursor: pointer; user-select: none; }
th:hover { color: var(--text); }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--panel-2); }
td.num { font-variant-numeric: tabular-nums; }
td.wrap { white-space: normal; min-width: 280px; }
td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
td .muted, .muted { color: var(--muted); }
.actions { display: flex; gap: 6px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--panel-2); color: var(--muted); }
.pill.ok { background: var(--ok-weak); color: var(--ok); }
.pill.warn { background: var(--warn-weak); color: var(--warn); }
.pill.err { background: var(--err-weak); color: var(--err); }
.pill.argo { background: #fbe9e1; color: #c2410c; font-size: 11px; padding: 0 6px; vertical-align: 1px; }
:root[data-theme="dark"] .pill.argo { background: #3a2016; color: #fb923c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.argo { background: #3a2016; color: #fb923c; } }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.error-box { background: var(--err-weak); color: var(--err); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; white-space: pre-wrap; }

/* drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 10; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(900px, 100vw); background: var(--panel); border-left: 1px solid var(--border); z-index: 11; display: none; flex-direction: column; }
.drawer.open, .drawer-bg.open { display: flex; }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.drawer-head h3 { margin: 0; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-head select { width: auto; }
.drawer.full { width: 100vw; }
.drawer-tools { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; font-size: 13px; }
.drawer-tools select { width: auto; padding: 4px 8px; }
.drawer-tools input[type=search] { width: 200px; padding: 4px 9px; flex: 1; min-width: 140px; }
.drawer-tools label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; user-select: none; }
.drawer-tools label:has(input:checked) { color: var(--text); }
.code-wrap { flex: 1; position: relative; min-height: 0; display: flex; }
.code { flex: 1; overflow: auto; background: var(--code-bg); color: var(--code-text); padding: 12px 16px; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
.code.nowrap, .code.nowrap > div { white-space: pre; word-break: normal; }
.code > div { white-space: pre-wrap; min-height: 1.5em; }
.code > div:hover { background: rgba(255,255,255,.04); }
.code .e { color: #ff8a8a; } .code .w { color: #f2c46d; } .code .note { color: #7c8a99; font-style: italic; }
.code mark { background: #f2c46d; color: #111; border-radius: 2px; }
/* Spring Boot console style (log view): date faint, level colored, logger cyan, exception red */
.code { tab-size: 4; }
.code .ent.err { background: rgba(255,90,90,.07); }
.code .ent.err:hover { background: rgba(255,90,90,.11); }
.code .c-ts, .code .c-dim { color: #7c8a99; }
.code .c-kts { color: #5d6b7a; }
.code .c-lv { font-weight: 600; }
.code .l-info, .code .l-debug, .code .l-trace { color: #3ccf7e; }
.code .l-warn { color: #f2c46d; }
.code .l-error { color: #ff6b6b; }
.code .c-pid { color: #d38cf0; }
.code .c-lg { color: #4fc1d9; }
.code .c-sum { color: #e6c07b; }
.code .c-err, .code .c-exc-h { color: #ff8a8a; }
.code .c-exc { display: block; }
.code .c-frame { color: #7c8a99; }
.code .lj { color: #8b95a3; cursor: pointer; }
.code .lj:hover { color: #c3cbd4; }
.code .lj-full { display: block; margin: 2px 0 6px 2ch; padding: 6px 10px; border-left: 2px solid #2a3440; background: rgba(255,255,255,.03); }
.code .j-k { color: #79b8ff; } .code .j-s { color: #9ecb7a; } .code .j-n { color: #f0a35e; } .code .j-b { color: #c792ea; }
.jump { position: absolute; right: 22px; bottom: 16px; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.jump.show { display: inline-block; }
.live { display: none; align-items: center; gap: 6px; font-size: 12px; color: var(--ok); font-weight: 600; }
.live.on { display: inline-flex; }
.live .dot { background: var(--ok); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.log-stat { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.podlink { cursor: pointer; } .podlink:hover { color: var(--accent); text-decoration: underline; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 20; display: none; }

@media (max-width: 1440px) {
  .conn #connText { display: none; }
  .conn { padding: 9px; }
}
@media (max-width: 980px) {
  .brand-id { display: none; }
  .search { order: 10; flex-basis: 100%; }
  .search input { width: 100% !important; }
}
@media (max-width: 640px) {
  .tb-row { padding: 10px 16px; gap: 8px; }
  .brand { border-right: 0; padding-right: 0; }
  .scope { order: 9; flex-basis: 100%; }
  .scope .sel { flex: 1; min-width: 0; }
  .sel select { max-width: none; width: 100%; }
  .sections { padding: 0 8px; }
  .sec span { font-size: 13px; }
  .subbar, .content, .foot { padding-left: 16px; padding-right: 16px; }
  .grid2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<!-- logo sprite (not display:none, so gradients keep working) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="anchorGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fed"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <symbol id="anchorLogo" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="12" fill="url(#anchorGrad)"/>
      <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="11.5" r="4"/><path d="M24 15.5V40"/><path d="M17 21h14"/>
        <path d="M11 27a13 13 0 0 0 26 0"/><path d="M8 30l3-3 3 3"/><path d="M34 30l3-3 3 3"/>
      </g>
    </symbol>
  </defs>
</svg>

<!-- splash -->
<div class="splash" id="splash">
  <div class="splash-inner">
    <div class="splash-logo"><svg viewBox="0 0 48 48"><use href="#anchorLogo"/></svg><span class="ripple"></span></div>
    <div class="splash-name">Anchor <span>K8s</span></div>
    <div class="splash-tag" data-i18n="app.tagline"></div>
    <div class="splash-bar"><i></i></div>
    <div class="splash-status" id="splashStatus" data-i18n="splash.loading"></div>
  </div>
</div>

<div class="app">
  <header class="topbar">
    <div class="tb-row">
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48"><use href="#anchorLogo"/></svg>
        <div class="brand-text"><div class="brand-name">Anchor <span>K8s</span></div><div class="brand-id">uz.az.anchor</div></div>
      </div>
      <div class="scope">
        <label class="sel"><span>Context</span><select id="ctx"></select></label>
        <label class="sel"><span>Namespace</span><select id="ns"></select></label>
      </div>
      <span class="tag conn"><span class="dot" id="conn"></span><span id="connText" data-i18n="conn.connecting"></span></span>

const LANGS = Object.keys(I18N);
function detectLang() {
  const saved = store.get('lang');
  if (LANGS.includes(saved)) return saved;
  // Uzbek by default; Russian-language browsers start in Russian
  return (navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'uz';
}
let LANG = detectLang();
function t(key, vars = {}) {
  const s = I18N[LANG][key] ?? I18N.en[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
}
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  const tail = $('#dTail').value || '500', auto = $('#dAuto').value || store.get('logAuto') || '5';
  $('#dTail').innerHTML = [100, 300, 500, 1000, 5000, 20000].map((n) => `<option value="${n}">${t('log.tailOpt', { n })}</option>`).join('');

  $('#dTail').value = tail; $('#dAuto').value = auto;
  $('#lang').value = LANG;
}

function ago(iso) {
  if (!iso) return '-';
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return Math.floor(s) + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

  return `<span class="pill ${cls}">${esc(st)}</span>`;
}

function termPill(lt) {
  if (!lt) return '';
  const cls = lt.reason === 'OOMKilled' || lt.reason === 'Error' ? 'err' : lt.reason === 'Completed' ? 'ok' : 'warn';
  return `<span class="pill ${cls}" title="exit ${esc(lt.exitCode)} · ${esc(lt.container)} · ${ago(lt.at)}">${esc(lt.reason)}</span>`;
}

function filtered(kind) {
  const q = S.q.toLowerCase();
  let rows = (S.data[kind] || []).filter((r) => !q || JSON.stringify(r).toLowerCase().includes(q));
  const s = S.sort[kind];
  if (s) rows = [...rows].sort((a, b) => {
    const x = a[s.key], y = b[s.key];
    const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x ?? '').localeCompare(String(y ?? ''), undefined, { numeric: true });
    return s.dir * r;
  });
  return rows;
}

function table(kind, rows) {
  const cols = COLS[kind].filter((c) => !(c[3] && S.ns !== '_all'));
  if (S.forbidden?.[kind]) return `<div class="tbl-wrap"><div class="empty">${t('empty.rbac')}</div></div>`;
  if (!rows.length) return `<div class="tbl-wrap"><div class="empty">${t('empty.none')}</div></div>`;
  const s = S.sort[kind];
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(([k, l]) =>
    `<th data-sort="${k}" data-kind="${kind}">${l ? t(l) : ''}${s?.key === k ? (s.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${cols.map(([k, , f, , cls]) =>
      `<td class="${cls || ''} ${typeof r[k] === 'number' ? 'num' : ''}">${f ? f(r) : esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

// ---------- overview ----------
function overview() {
  const pods = S.data.pods || [], deps = S.data.deployments || [], ev = S.data.events || [], nodes = S.data.nodes || [];
  const h = { ok: 0, warn: 0, err: 0 }; pods.forEach((p) => h[podHealth(p)]++);
  const depOk = deps.filter((d) => d.ready === d.replicas).length;
  const warns = ev.filter((e) => e.type === 'Warning');
  const pct = (n) => (pods.length ? (n / pods.length) * 100 : 0);

  return `
  <div class="cards">
    ${card('pods', 'Pods', pods.length, `<span style="color:var(--ok)">● ${t('ov.running', { n: h.ok })}</span><span style="color:var(--warn)">● ${h.warn}</span><span style="color:var(--err)">● ${t('ov.failed', { n: h.err })}</span>`,
      `<div class="bar"><i style="width:${pct(h.ok)}%;background:var(--ok)"></i><i style="width:${pct(h.warn)}%;background:var(--warn)"></i><i style="width:${pct(h.err)}%;background:var(--err)"></i></div>`)}
    ${card('deployments', 'Deployments', deps.length, `<span class="muted">${t('ov.dep', { ok: depOk, bad: deps.length - depOk })}</span>`)}
    ${card('services', 'Services', (S.data.services || []).length, '<span class="muted">ClusterIP / LB / NodePort</span>')}
    ${card('events', t('ov.warnings'), warns.length, '<span class="muted">Warning events</span>')}
    ${card('nodes', 'Nodes', S.forbidden?.nodes ? '🔒' : nodes.length, `<span class="muted">${nodes.filter((n) => n.status === 'Ready').length} Ready</span>`)}
    ${(S.data.metrics || []).length ? card('resources', 'RAM', fmtMem(S.data.metrics.reduce((a, m) => a + m.memory, 0)), `<span class="muted">CPU ${fmtCpu(S.data.metrics.reduce((a, m) => a + m.cpu, 0))}</span>`) : ''}
    ${card('health', t('view.health'), healthIssues().total, `<span class="muted">OOMKilled ${healthIssues().oom.length} · ${t('h.probe')} ${healthIssues().probes.length}</span>`)}
  </div>
  <div class="grid2">
    <div><h2>${t('ov.badPods')}</h2>${bad.length ? table('pods', bad) : `<div class="tbl-wrap"><div class="empty">${t('ov.allGood')}</div></div>`}</div>
    <div><h2>${t('ov.recentWarn')}</h2>${table('events', warns.slice(0, 8))}</div>
  </div>`;
}

// ---------- shared helpers for the monitoring tabs ----------
const fmtMem = (b) => (b == null ? '—' : b >= 2 ** 30 ? (b / 2 ** 30).toFixed(2) + ' GiB' : Math.round(b / 2 ** 20) + ' MiB');
const fmtCpu = (c) => (c == null ? '—' : c >= 1 ? c.toFixed(2) : Math.round(c * 1000) + 'm');
function fmtDur(sec) {
  if (sec == null) return '-';
  if (sec < 60) return sec + 's';
  if (sec < 3600) return `${Math.floor(sec / 60)}m ${sec % 60}s`;
  return `${Math.floor(sec / 3600)}h ${Math.floor((sec % 3600) / 60)}m`;
}
// node capacity strings ("32Gi", "32774112Ki", "8") -> bytes / cores
function qtyBytes(q) {
  const m = /^([0-9.]+)(Ki|Mi|Gi|Ti|k|M|G|T)?$/.exec(String(q || ''));
  return m ? Number(m[1]) * ({ Ki: 2 ** 10, Mi: 2 ** 20, Gi: 2 ** 30, Ti: 2 ** 40, k: 1e3, M: 1e6, G: 1e9, T: 1e12 }[m[2]] ?? 1) : 0;
}
const qtyCores = (q) => (/m$/.test(String(q)) ? parseFloat(q) / 1000 : parseFloat(q) || 0);
function meter(v, max, cls = '') {
  const pct = max && v != null ? Math.min(100, (v / max) * 100) : 0;
  return `<span class="meter ${cls}"><i style="width:${pct.toFixed(1)}%"></i></span>`;
}
// tiny inline trend line; turns orange when the value grew by >10% over the window
function spark(vals, w = 96, h = 22) {
  if (vals.length < 2) return '<span class="muted">…</span>';
  const max = Math.max(...vals), min = Math.min(...vals), span = max - min || 1;
  const pts = vals.map((v, i) => `${((i / (vals.length - 1)) * w).toFixed(1)},${(h - 2 - ((v - min) / span) * (h - 4)).toFixed(1)}`).join(' ');
  const up = vals[vals.length - 1] > vals[0] * 1.1;
  return `<svg class="spark${up ? ' up' : ''}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}"/></svg>`;
}
const readyPill = (ready, want) => `<span class="pill ${ready === want ? 'ok' : ready === 0 && want > 0 ? 'err' : 'warn'}">${ready}/${want}</span>`;
const yamlBtn = (o, kind) => `<div class="actions"><button class="btn sm" data-act="yaml" data-kind="${kind}" ${attrs(o)}>YAML</button></div>`;
const emptyBox = (msg) => `<div class="tbl-wrap"><div class="empty">${msg}</div></div>`;
const podKey = (o) => `${o.namespace}/${o.name}`;
const matchQ = (s) => !S.q || String(s).toLowerCase().includes(S.q.toLowerCase());

// ---------- metrics history (kept in memory while the page is open) ----------
const HIST_MAX = 120;
function recordMetrics() {
  const now = Date.now();
  S.mx = new Map((S.data.metrics || []).map((m) => [podKey(m), m]));
  for (const [k, m] of S.mx) {
    let h = S.hist.get(k);
    if (!h) S.hist.set(k, (h = []));
    const last = h[h.length - 1];
    if (!last || now - last.t > 1500) {
      h.push({ t: now, cpu: m.cpu, mem: m.memory });
      if (h.length > HIST_MAX) h.shift();
    }
  }
}

// ---------- Resources (RAM / CPU) ----------
const R = { maxCpu: 0, maxMem: 0 };
function resourcesView() {
  if (S.forbidden?.metrics) return emptyBox(t('res.forbidden'));
  const pods = S.data.pods || [];
  let rows = pods.map((p) => {
    const m = S.mx?.get(podKey(p));
    return { ...p, cpu: m?.cpu ?? null, mem: m?.memory ?? null, key: podKey(p) };
  }).filter((r) => r.mem != null);
  if (!rows.length) return emptyBox(S.metricsError ? `${t('res.none')}<br><span class="muted">${esc(S.metricsError)}</span>` : t('res.none'));

  const totalCpu = rows.reduce((a, r) => a + r.cpu, 0), totalMem = rows.reduce((a, r) => a + r.mem, 0);
  const noLim = pods.filter((p) => p.memLim == null);
  const top = [...rows].sort((a, b) => b.mem - a.mem)[0];
  const byApp = S.resMode === 'app';
  if (byApp) {
    const g = new Map();
    for (const r of rows) {
      const k = `${r.namespace}/${r.app || r.name}`;
      const cur = g.get(k) || { name: r.app || r.name, namespace: r.namespace, pods: 0, cpu: 0, mem: 0, noLimit: false };
      cur.pods++; cur.cpu += r.cpu; cur.mem += r.mem; cur.noLimit ||= r.memLim == null;
      g.set(k, cur);
    }
    rows = [...g.values()];
  }
  rows = rows.filter((r) => matchQ(r.name));
  if (!S.sort.resources && !S.sort.resApps) rows.sort((a, b) => b.mem - a.mem);
  R.maxCpu = Math.max(...rows.map((r) => r.cpu), 0); R.maxMem = Math.max(...rows.map((r) => r.mem), 0);

  // node usage, when the kubeconfig user may read node metrics
  let nodes = '';

    nodes = `<h2>Nodes</h2><div class="cards">${nm.map((n) => {
      const c = cap.get(n.name), cc = qtyCores(c?.cpu), mc = qtyBytes(c?.memory);
      return `<div class="card static"><div class="k">${esc(n.name)}</div>
        <div class="s">CPU ${fmtCpu(n.cpu)}${cc ? ' / ' + cc : ''} ${meter(n.cpu, cc)}</div>
        <div class="s">RAM ${fmtMem(n.memory)}${mc ? ' / ' + fmtMem(mc) : ''} ${meter(n.memory, mc, mc && n.memory / mc > 0.9 ? 'err' : '')}</div></div>`;
    }).join('')}</div>`;
  } else if (S.forbidden?.nodeMetrics) nodes = `<p class="muted small">🔒 ${t('res.nodesForbidden')}</p>`;

  const card = (k, v, s, cls = '') => `<div class="card static ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  return `
  <div class="cards">
    ${card(t('res.totalCpu'), fmtCpu(totalCpu), `<span class="muted">${t('res.pods', { n: rows.length })}</span>`)}
    ${card(t('res.totalMem'), fmtMem(totalMem), `<span class="muted">${t('res.pods', { n: rows.length })}</span>`)}
    ${card(t('res.noLimitCount'), `${noLim.length}<small>/${pods.length}</small>`, `<span class="muted">${t('res.noLimitTip')}</span>`, noLim.length ? 'warn-card' : '')}
    ${card(t('res.top'), fmtMem(top.mem), `<span class="mono">${esc(top.name)}</span>`)}
  </div>
  ${nodes}
  <div class="toolbar">
    <div class="seg">

// ---------- Health ----------
function healthIssues() {
  const pods = S.data.pods || [], ev = S.data.events || [];
  const oom = pods.filter((p) => p.lastTerm?.reason === 'OOMKilled');
  const crash = pods.filter((p) => /CrashLoopBackOff|^Error$|ImagePullBackOff|ErrImagePull|CreateContainer/.test(p.status));
  const notReady = pods.filter((p) => { const [a, b] = String(p.ready).split('/').map(Number); return p.status === 'Running' && a < b; });
  const restarts = pods.filter((p) => p.restarts > 5);
  // probe failures = "Unhealthy" events, grouped per pod
  const pm = new Map();
  for (const e of ev) {
    if (e.reason !== 'Unhealthy') continue;
    const cur = pm.get(e.object);
    if (!cur) pm.set(e.object, { object: e.object, count: e.count, message: e.message, last: e.last });
    else { cur.count += e.count; if ((e.last || '') > (cur.last || '')) { cur.last = e.last; cur.message = e.message; } }
  }
  const probes = [...pm.values()].sort((a, b) => (b.last || '').localeCompare(a.last || ''));
  return { oom, crash, notReady, restarts, probes, total: new Set([...oom, ...crash, ...notReady].map(podKey)).size + probes.length };
}
function healthView() {
  const h = healthIssues();
  const card = (k, v, cls) => `<div class="card static ${v ? cls : ''}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const terms = (S.data.pods || []).filter((p) => p.lastTerm && matchQ(p.name)).sort((a, b) => (b.lastTerm.at || '').localeCompare(a.lastTerm.at || ''));
  const probes = h.probes.filter((p) => matchQ(p.object));
  return `
  <div class="cards">
    ${card('OOMKilled', h.oom.length, 'err-card')}
    ${card(t('h.crash'), h.crash.length, 'err-card')}
    ${card(t('h.notReady'), h.notReady.length, 'warn-card')}
    ${card(t('h.probe'), h.probes.length, 'warn-card')}
    ${card(t('h.highRestarts'), h.restarts.length, 'warn-card')}
  </div>
  <div class="grid2">
    <div><h2>${t('h.lastTerm')}</h2>${terms.length ? table('lastTerm', terms) : emptyBox(t('h.none'))}</div>
    <div><h2>${t('h.probeFails')}</h2>${probes.length ? table('probes', probes) : emptyBox(t('h.none'))}</div>
    <div>${alertsPanel()}</div>
  </div>`;
}

// ---------- Alerts ----------
const A = { rules: { mem: 0, restart: true, nginx: true, notify: false }, log: [], unread: 0, memOver: new Set(), prevRestarts: null, prevUp: {} };
try { Object.assign(A.rules, JSON.parse(store.get('alerts') || '{}')); } catch { /* defaults */ }
const saveRules = () => store.set('alerts', JSON.stringify(A.rules));
function fire(kind, text) {
  A.log.unshift({ at: new Date().toISOString(), kind, text });
  if (A.log.length > 100) A.log.length = 100;
  if (S.view !== 'health') A.unread++;
  toast('🔔 ' + text);
  if (A.rules.notify && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification('Anchor K8s', { body: text, icon: 'logo.svg', tag: kind + ':' + text }); } catch { /* unsupported */ }
  }
}
function checkPodAlerts() {
  const cur = new Map((S.data.pods || []).map((p) => [podKey(p), p]));
  if (A.prevRestarts && A.rules.restart) {
    for (const [k, p] of cur) {
      const prev = A.prevRestarts.get(k);
      if (prev != null && p.restarts > prev) fire('restart', t('al.fired.restart', { pod: p.name, n: p.restarts, r: p.lastTerm?.reason || '?' }));
    }
  }
  A.prevRestarts = new Map([...cur].map(([k, p]) => [k, p.restarts]));
  if (A.rules.mem > 0) {
    const lim = A.rules.mem * 2 ** 20;
    for (const [k, m] of S.mx || []) {
      if (m.memory > lim) {
        if (!A.memOver.has(k)) { A.memOver.add(k); fire('mem', t('al.fired.mem', { pod: m.name, v: fmtMem(m.memory), lim: A.rules.mem })); }
      } else A.memOver.delete(k);
    }
  }
}
function checkNginxAlerts() {
  for (const u of nginxTargets()) {
    const r = S.probes[u];
    if (!r) continue;
    const was = A.prevUp[u];
    if (A.rules.nginx && was === true && !r.up) fire('nginx', t('al.fired.nginx', { url: u, e: r.error || r.status }));
    if (A.rules.nginx && was === false && r.up) fire('nginx', t('al.fired.nginxUp', { url: u }));
    A.prevUp[u] = r.up;
  }
}
function alertsPanel() {
  const r = A.rules;
  return `<h2>🔔 ${t('al.title')}</h2>
  <div class="panel">
    <div class="form-row"><label>${t('al.mem')} <input type="number" class="num-in" data-rule="mem" min="0" step="64" value="${r.mem}"> MiB</label><span class="muted small">${t('al.memHint')}</span></div>
    <div class="form-row"><label><input type="checkbox" data-rule="restart" ${r.restart ? 'checked' : ''}> ${t('al.restart')}</label></div>
    <div class="form-row"><label><input type="checkbox" data-rule="nginx" ${r.nginx ? 'checked' : ''}> ${t('al.nginx')}</label></div>
    <div class="form-row"><label><input type="checkbox" data-rule="notify" ${r.notify ? 'checked' : ''}> ${t('al.notify')}</label></div>
    <div class="al-log-head"><b>${t('al.log')}</b>${A.log.length ? `<button class="btn sm" data-act="alclear">${t('al.clear')}</button>` : ''}</div>
    <div class="al-log">${A.log.length ? A.log.map((a) => `<div><span class="muted">${new Date(a.at).toLocaleTimeString()}</span> ${esc(a.text)}</div>`).join('') : `<div class="muted">${t('al.empty')}</div>`}</div>
  </div>`;
}

// ---------- Versions ----------
async function loadVersions() {
  const nss = S.nsNames || [S.ns];
  const res = await Promise.allSettled(nss.map((n) => api(`/${encodeURIComponent(n)}/deployments`)));
  S.versions = nss.map((n, i) => ({
    ns: n,
    deps: res[i].status === 'fulfilled' ? res[i].value : null,
    locked: res[i].status === 'rejected' && /forbidden/i.test(res[i].reason.message),
  }));
}
const imgTag = (img) => { const s = img.split('@')[0]; const i = s.lastIndexOf(':'); return i > s.lastIndexOf('/') ? s.slice(i + 1) : 'latest'; };
function versionsView() {
  if (!S.versions) return emptyBox(t('loading'));
  const cols = S.versions;
  const names = [...new Set(cols.flatMap((c) => (c.deps || []).map((d) => d.name)))].sort();
  let diffCount = 0;
  const rows = names.map((name) => {
    const cells = cols.map((c) => {
      const d = (c.deps || []).find((x) => x.name === name);
      return d ? { tag: d.images.map(imgTag).join(', '), img: d.images.join('\n'), d } : null;
    });
    const tags = cells.filter(Boolean).map((c) => c.tag);
    const freq = tags.reduce((m, x) => m.set(x, (m.get(x) || 0) + 1), new Map());
    const common = [...freq].sort((a, b) => b[1] - a[1])[0]?.[0];
    const diff = freq.size > 1;
    if (diff) diffCount++;
    return { name, cells, diff, common };
  }).filter((r) => matchQ(r.name) && (!S.vOnlyDiff || r.diff));
  const head = cols.map((c) => `<th>${esc(c.ns)}${c.locked ? ' 🔒' : ''}</th>`).join('');
  const body = rows.map((r) => `<tr class="${r.diff ? 'vrow-diff' : ''}"><td><b>${esc(r.name)}</b></td>${r.cells.map((c, i) => !c ? '<td class="muted">—</td>'
    : `<td><span class="mono ${r.diff && c.tag !== r.common ? 'vdiff' : ''}" title="${esc(c.img)}">${esc(c.tag)}</span>
       <span class="muted small">${c.d.ready}/${c.d.replicas}</span>
       <button class="btn xs" data-act="history" data-ns="${esc(cols[i].ns)}" data-name="${esc(r.name)}" title="${esc(t('btn.history'))}">⟲</button></td>`).join('')}</tr>`).join('');
  return `<div class="toolbar">
    <label class="tag"><input type="checkbox" data-vonly ${S.vOnlyDiff ? 'checked' : ''}> ${t('v.onlyDiff')}</label>
    <span class="muted small">${t('v.diffs', { n: diffCount, total: names.length, ns: cols.length })}</span>
  </div>
  ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Deployment</th>${head}</tr></thead><tbody>${body}</tbody></table></div>` : emptyBox(t('empty.none'))}`;
}

// ---------- Nginx ----------
const nginxTargets = () => { try { return JSON.parse(store.get('nginxTargets') || '[]'); } catch { return []; } };
const saveTargets = (a) => store.set('nginxTargets', JSON.stringify(a));
// probes run in the background so a slow target never delays the main refresh
async function runProbes(only) {
  const urls = only ? [only] : nginxTargets();
  if (!urls.length || (S.probing && !only)) return;
  if (!only) S.probing = true;
  try {
    const res = await Promise.allSettled(urls.map((u) => api('/probe', { method: 'POST', body: { url: u } })));
    urls.forEach((u, i) => {
      S.probes[u] = res[i].status === 'fulfilled' ? res[i].value : { url: u, up: false, error: res[i].reason.message, at: new Date().toISOString() };
    });
  } finally { if (!only) S.probing = false; }
  checkNginxAlerts();
  if (S.view === 'nginx' || S.view === 'health') render(); else renderNav();
}
function tlsCell(x) {
  if (!x) return '<span class="muted">—</span>';
  const days = Math.floor((new Date(x.validTo) - Date.now()) / 86400000);
  const cls = days < 0 ? 'err' : days < 14 ? 'warn' : 'ok';
  const tip = `${x.subject} · ${x.issuer} · ${new Date(x.validTo).toLocaleDateString()}${x.error ? ' · ' + x.error : ''}`;
  return `<span class="pill ${cls}" title="${esc(tip)}">${days < 0 ? t('ng.expired') : t('ng.days', { n: days })}</span>${x.authorized ? '' : ` <span class="pill warn" title="${esc(x.error || '')}">⚠ TLS</span>`}`;
}
function nginxView() {
  const urls = nginxTargets();
  const rows = urls.map((u) => {
    const r = S.probes[u];
    const st = !r ? '<span class="muted">…</span>' : r.up ? `<span class="pill ok">${t('ng.up')}</span>` : `<span class="pill err" title="${esc(r.error || '')}">${t('ng.down')}</span>`;
    const stub = r?.stub ? `<span title="accepts ${r.stub.accepts} · handled ${r.stub.handled} · reading ${r.stub.reading} · writing ${r.stub.writing} · waiting ${r.stub.waiting}">${r.stub.active} / ${r.stub.requests.toLocaleString()}</span>` : '<span class="muted">—</span>';
    return `<tr><td class="mono"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></td><td>${st}</td>

      <td class="mono muted">${esc(r?.server || (r?.error ? r.error : '—'))}</td><td>${tlsCell(r?.tls)}</td><td class="num">${stub}</td>
      <td class="muted">${r ? ago(r.at) : ''}</td>
      <td><div class="actions"><button class="btn sm" data-act="ngcheck" data-url="${esc(u)}">↻</button><button class="btn sm danger" data-act="ngdel" data-url="${esc(u)}">✕</button></div></td></tr>`;
  }).join('');
  const isNginx = (o) => /nginx|ingress/i.test(o.name + ' ' + (o.images || []).join(' '));
  const inCluster = [...(S.data.deployments || []), ...(S.data.statefulsets || []), ...(S.data.daemonsets || [])].filter(isNginx).filter((o) => matchQ(o.name));
  return `<h2>${t('ng.ext')}</h2>
  <form class="toolbar" data-form="ng">
    <input type="url" id="ngUrl" class="url-in" placeholder="${esc(t('ng.placeholder'))}" required>
    <button class="btn primary" type="submit">${t('ng.add')}</button>
    <span class="muted small">${t('ng.stubHint')}</span>
  </form>
  ${urls.length ? `<div class="tbl-wrap"><table><thead><tr><th>URL</th><th>${t('col.status')}</th><th>HTTP</th><th>${t('ng.time')}</th><th>Server</th><th>TLS</th><th title="stub_status: active / requests">${t('ng.conns')}</th><th>${t('ng.checked')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : emptyBox(t('ng.none'))}
  <h2 style="margin-top:20px">${t('ng.cluster')}</h2>
  ${inCluster.length ? `<div class="tbl-wrap"><table><thead><tr><th>${t('col.name')}</th><th>Namespace</th><th>Image</th><th>Ready</th></tr></thead><tbody>${inCluster.map((o) =>
    `<tr><td><b>${esc(o.name)}</b></td><td class="muted">${esc(o.namespace)}</td><td class="mono muted">${esc((o.images || []).join(', '))}</td><td>${readyPill(o.ready, o.replicas ?? o.desired)}</td></tr>`).join('')}</tbody></table></div>` : emptyBox(t('ng.clusterNone'))}`;
}

// ---------- rollout history (drawer) ----------
function historyHTML(list) {

async function load() {
  const ns = encodeURIComponent(S.ns);
  const core = ['pods', 'deployments', 'services', 'ingresses', 'events', 'nodes'];
  const extra = LAZY.includes(S.view) ? [S.view] : [];
  const nodeMx = S.view === 'resources' || S.view === 'nodes';
  const names = [...core, 'metrics', ...(nodeMx ? ['nodeMetrics'] : []), ...extra];
  const url = (k) => (k === 'nodes' ? '/nodes' : k === 'nodeMetrics' ? '/nodes/metrics' : `/${ns}/${k}`);
  const res = await Promise.allSettled(names.map((k) => api(url(k))));
  const errs = [];
  S.forbidden = {};
  S.metricsError = null;
  names.forEach((k, i) => {
    const r = res[i];
    if (r.status === 'fulfilled') S.data[k] = r.value;
    else if (/forbidden/i.test(r.reason.message)) { S.data[k] = []; S.forbidden[k] = true; }
    else if (k === 'metrics' || k === 'nodeMetrics') { S.data[k] = []; S.metricsError = r.reason.message; } // no metrics-server is not a connection error

}

  return `<div class="ent${lv === 'ERROR' ? ' err' : ''}" data-i="${i}">${h}</div>`;
}
const filterQ = () => $('#dFilter').value;
const visible = (l, q) => !q || !$('#dOnly').checked || l.toLowerCase().includes(q.toLowerCase());
const atBottom = () => { const b = $('#dBody'); return b.scrollHeight - b.scrollTop - b.clientHeight < 40; };
function scrollEnd() { const b = $('#dBody'); b.scrollTop = b.scrollHeight; }
function updateJump() { $('#dJump').classList.toggle('show', isLogs() && !atBottom()); }
function updateStat(time) {
  if (!isLogs()) { $('#dStat').textContent = ''; return; }
  const q = filterQ();
  const n = q ? D.lines.filter((l) => l.toLowerCase().includes(q.toLowerCase())).length : null;
  if (time) D.updated = new Date().toLocaleTimeString();
  $('#dStat').textContent = t('log.lines', { n: D.lines.length }) + (q ? ` · ${t('log.matches', { n })}` : '') + (D.updated ? ` · ${D.updated}` : '');
}
function renderLog() {
  const q = filterQ();
  const pretty = $('#dPretty').checked, app = $('#dContainer').value || D.app;
  const html = D.lines.map((l, i) => (!visible(l, q) ? '' : pretty ? prettyHTML(l, i, q, app) : lineHTML(l, q))).join('');
  $('#dBody').innerHTML = html || `<div class="note">${D.lines.length ? t('log.noMatch') : t('log.empty')}</div>`;
  updateStat();
}

// kubectl logs --tail N [-c container] [--previous] [--timestamps]; refreshed by timer or ↻
async function loadLogs(first) {
  const id = ++D.req;
  if (first) $('#dBody').innerHTML = `<div class="note">${t('loading')}</div>`;
  const qs = new URLSearchParams({
    container: $('#dContainer').value || '', tail: $('#dTail').value,
    previous: $('#dPrev').checked ? '1' : '0', timestamps: $('#dTs').checked ? '1' : '0',
  });
  try {
    const { text } = await api(`/${encodeURIComponent(D.ns)}/pods/${encodeURIComponent(D.name)}/logs?${qs}`);
    if (id !== D.req || !isLogs()) return; // a newer request or another drawer took over
    const body = $('#dBody'), stick = first || atBottom(), top = body.scrollTop;
    D.lines = (text || '').replace(/\n$/, '').split('\n').filter((l, i, a) => l || a.length > 1);
    renderLog(); updateStat(true);
    if (stick) scrollEnd(); else body.scrollTop = top;
    updateJump();
  } catch (e) {
    if (id !== D.req) return;
    $('#dBody').innerHTML = `<div class="e">${esc(t('err', { m: e.message }))}</div>`;
  }
}
function setLogAuto() {
  clearInterval(D.timer); D.timer = null;
  const sec = $('#dPrev').checked ? 0 : Number($('#dAuto').value);
  $('#dLive').classList.toggle('on', !!sec && isLogs());
  if (sec && isLogs()) D.timer = setInterval(() => { if (!document.hidden) loadLogs(); }, sec * 1000);
}
function stopLogs() { clearInterval(D.timer); D.timer = null; D.req++; $('#dLive').classList.remove('on'); }

async function drawerLoad() {
  if (isLogs()) { setLogAuto(); return loadLogs(true); }
  const body = $('#dBody'); body.textContent = t('loading');
  const base = `/${encodeURIComponent(D.ns)}`, nm = encodeURIComponent(D.name);
  try {
    if (D.kind === 'history') {
      const list = await api(`${base}/deployments/${nm}/history`);
      D.text = historyText(list);
      body.innerHTML = historyHTML(list);
      return;
    }
    const kind = D.kind === 'podyaml' ? 'pods' : D.kind === 'depyaml' ? 'deployments' : D.res;
    D.text = (await api(`${base}/${kind}/${nm}/yaml`)).text;
    body.textContent = D.text;
  } catch (e) { body.textContent = t('err', { m: e.message }); }
}
const drawerTitle = () => (isLogs() ? t('log.title') : D.kind === 'history' ? t('hist.title') : 'YAML') + ' · ' + D.name;
function openDrawer(kind, ns, name, opts = {}) {
  stopLogs();
  Object.assign(D, { kind, ns, name, res: opts.res, lines: [], text: '', updated: null, open: new Set() });
  const log = isLogs();
  $('#dTitle').textContent = drawerTitle();
  $('#dTools').hidden = !log;
  $('#dDownload').hidden = !log;
  $('#dStat').textContent = '';
  const pod = (S.data.pods || []).find((p) => p.name === name && p.namespace === ns);
  const cs = log && pod ? pod.containers : [];
  D.app = cs[0] || '';
  $('#dContainer').hidden = cs.length < 2;
  $('#dContainer').innerHTML = cs.map((c) => `<option>${esc(c)}</option>`).join('');
  $('#dPrev').checked = !!opts.previous;
  $('#dFilter').value = '';
  $('#dBody').classList.toggle('nowrap', log && !$('#dWrap').checked);
  $('#drawer').classList.add('open'); $('#drawerBg').classList.add('open');
  updateJump();
  drawerLoad();
}
function closeDrawer() { stopLogs(); D.kind = null; $('#drawer').classList.remove('open'); $('#drawerBg').classList.remove('open'); }
const drawerText = () => (isLogs() ? D.lines.join('\n') : D.text);

$('#dClose').addEventListener('click', closeDrawer);
$('#drawerBg').addEventListener('click', closeDrawer);
$('#dReload').addEventListener('click', () => (isLogs() ? loadLogs() : drawerLoad()));
['#dTail', '#dTs', '#dContainer', '#dPrev'].forEach((s) => $(s).addEventListener('change', drawerLoad));
$('#dAuto').addEventListener('change', () => { store.set('logAuto', $('#dAuto').value); setLogAuto(); });
$('#dWrap').addEventListener('change', () => $('#dBody').classList.toggle('nowrap', !$('#dWrap').checked));
$('#dPretty').checked = store.get('logPretty') !== '0';
$('#dPretty').addEventListener('change', () => { store.set('logPretty', $('#dPretty').checked ? '1' : '0'); if (isLogs()) renderLog(); });
// ▸ / ▾ toggles the pretty-printed JSON payload of one log line
$('#dBody').addEventListener('click', (ev) => {
  const row = ev.target.closest('.lj')?.closest('[data-i]');
  const raw = row && D.lines[Number(row.dataset.i)];
  if (raw == null) return;
  if (D.open.has(raw)) D.open.delete(raw); else D.open.add(raw);
  row.outerHTML = prettyHTML(raw, Number(row.dataset.i), filterQ(), $('#dContainer').value || D.app);
  updateJump();
});
$('#dFilter').addEventListener('input', () => { renderLog(); scrollEnd(); updateJump(); });
$('#dOnly').addEventListener('change', () => { renderLog(); scrollEnd(); });
$('#dBody').addEventListener('scroll', updateJump);
$('#dJump').addEventListener('click', () => { scrollEnd(); updateJump(); });
$('#dFull').addEventListener('click', () => $('#drawer').classList.toggle('full'));
$('#dCopy').addEventListener('click', () => navigator.clipboard?.writeText(drawerText()).then(() => toast(t('toast.copied'))));
$('#dDownload').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([drawerText()], { type: 'text/plain' }));
  a.download = `${D.name}-${new Date().toISOString().slice(0, 19).replace(/:/g, '')}.log`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

// ---------- events ----------
// top sections and their sub-tabs
for (const el of ['#sections', '#subtabs']) {
  $(el).addEventListener('click', (e) => {
    const b = e.target.closest('[data-view]');
    if (b) setView(b.dataset.view);
  });
}
$('#content').addEventListener('click', async (e) => {
  const go = e.target.closest('[data-go]');
  const th = e.target.closest('th[data-sort]');
  const b = e.target.closest('[data-act]');
  if (th && th.dataset.sort !== '_a') {
    const k = th.dataset.kind, key = th.dataset.sort, cur = S.sort[k];
    S.sort[k] = { key, dir: cur?.key === key ? -cur.dir : 1 }; render(); return;
  }
  if (b) {
    const { act, ns, name } = b.dataset;
    const enc = `/${encodeURIComponent(ns)}`;
    try {
      if (act === 'logs' || act === 'podyaml' || act === 'depyaml' || act === 'history') return openDrawer(act, ns, name);
      if (act === 'prevlogs') return openDrawer('logs', ns, name, { previous: true });
      if (act === 'yaml') return openDrawer('yaml', ns, name, { res: b.dataset.kind });
      if (act === 'alclear') { A.log = []; A.unread = 0; render(); return; }
      if (act === 'ngcheck') { await runProbes(b.dataset.url); return; }
      if (act === 'ngdel') { saveTargets(nginxTargets().filter((u) => u !== b.dataset.url)); delete S.probes[b.dataset.url]; render(); return; }
      if (act === 'delpod') {
        if (!confirm(t('confirm.delpod', { name }))) return;
        await api(`${enc}/pods/${encodeURIComponent(name)}`, { method: 'DELETE' }); toast(t('toast.deleted'));
      }
      if (act === 'restartpod') {
        if (!confirm(t('confirm.restartpod', { name }))) return;
        await api(`${enc}/pods/${encodeURIComponent(name)}/restart`, { method: 'POST' }); toast(t('toast.restartedPod'));
      }
      if (act === 'scale') {
        const argo = b.dataset.argo;
        const v = prompt(t('prompt.scale', { name }) + (argo ? '\n\n' + t('prompt.argo', { a: argo }) : ''), b.dataset.r);
        if (v === null) return;
        await api(`${enc}/deployments/${encodeURIComponent(name)}/scale`, { method: 'POST', body: { replicas: Number(v) } }); toast(`Scale: ${v}`);
      }
      if (act === 'restart') {
        if (!confirm(t('confirm.restart', { name }))) return;
        await api(`${enc}/deployments/${encodeURIComponent(name)}/restart`, { method: 'POST' }); toast(t('toast.restarting'));
      }
      load();
    } catch (err) { toast(t('err', { m: err.message })); }
    return;
  }
  const rm = e.target.closest('[data-resmode]');
  if (rm) { S.resMode = rm.dataset.resmode; render(); return; }
  if (go) { setView(go.dataset.go); }
});
// settings inside the content area (alert rules, versions filter)
$('#content').addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.rule) {
    const k = el.dataset.rule;
    A.rules[k] = el.type === 'checkbox' ? el.checked : Math.max(0, Number(el.value) || 0);
    if (k === 'notify' && el.checked && 'Notification' in window && Notification.permission !== 'granted') {
      if ((await Notification.requestPermission()) !== 'granted') { A.rules.notify = false; el.checked = false; toast(t('al.denied')); }
    }
    if (k === 'mem') A.memOver.clear();
    saveRules();
    el.blur();
  }
  if (el.matches('[data-vonly]')) { S.vOnlyDiff = el.checked; el.blur(); render(); }
});
$('#content').addEventListener('submit', async (e) => {
  if (e.target.dataset.form !== 'ng') return;
  e.preventDefault();
  const inp = $('#ngUrl'), u = inp.value.trim();
  if (!/^https?:\/\//i.test(u)) return;
  const list = nginxTargets();
  if (!list.includes(u)) saveTargets([...list, u]);
  inp.blur();
  render();
  await runProbes(u);
});
// switching tabs: lazy kinds and the versions matrix are fetched on first open
function setView(v) {
  S.view = v; store.set('view', v);
  const g = groupOf(v); if (g) S.lastIn[groupKey(g)] = v; // a section reopens on the tab used last
  render();
  if (LAZY.includes(v) || v === 'versions' || v === 'resources' || v === 'nodes') load();
}
$('#ns').addEventListener('change', () => {
  S.ns = $('#ns').value; store.set('ns:' + S.info.currentContext, S.ns);
  S.data = {}; render(); load();
});
$('#ctx').addEventListener('change', async () => {
  try { await api('/context', { method: 'POST', body: { name: $('#ctx').value } }); S.data = {}; init(); toast('Context: ' + $('#ctx').value); }
  catch (e) { toast(t('err', { m: e.message })); }
});
$('#q').addEventListener('input', () => { S.q = $('#q').value; if (S.view === 'overview' && S.q) S.view = 'pods'; render(); });
$('#refresh').addEventListener('click', load);
$('#auto').addEventListener('change', setAuto);
$('#lang').addEventListener('change', () => {
  LANG = $('#lang').value; store.set('lang', LANG);
  applyI18n(); renderFoot(); renderConn(); render();
  if (D.kind) { $('#dTitle').textContent = drawerTitle(); if (isLogs()) renderLog(); }
});
$('#theme').addEventListener('click', () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('theme', next);
});
{ const th = store.get('theme'); if (th) document.documentElement.dataset.theme = th; }
document.addEventListener('keydown', (e) => {
  const open = $('#drawer').classList.contains('open');
  if (open && isLogs() && (e.metaKey || e.ctrlKey) && e.key === 'f') { e.preventDefault(); $('#dFilter').focus(); $('#dFilter').select(); return; }
  if (e.key === 'Escape') { if (document.activeElement === $('#dFilter') && $('#dFilter').value) { $('#dFilter').value = ''; renderLog(); scrollEnd(); return; } closeDrawer(); }
  if (e.key === '/' && !open && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').focus(); }
});

// ---------- start: splash stays at least ~1s so the logo is seen, then fades ----------
applyI18n();
const splashStart = Date.now();
function hideSplash() {
  setTimeout(() => {
    $('#splash').classList.add('hide');
    setTimeout(() => $('#splash').remove(), 500);
  }, Math.max(0, 1100 - (Date.now() - splashStart)));
}
init().finally(hideSplash);
</script>
</body>
</html>
