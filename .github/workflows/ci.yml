name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Smoke test (demo mode)
        run: |
          DEMO=1 node server.js > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:9901/api/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:9901/api/info | grep -q '"demo":true'
          curl -sf http://127.0.0.1:9901/api/mobile-dev/pods | grep -q '"name"'
          curl -sf http://127.0.0.1:9901/api/mobile-dev/metrics | grep -q '"memory"'
          curl -sf http://127.0.0.1:9901/ | grep -q 'Anchor K8s'
      - name: Server log
        if: failure()
        run: cat server.log
